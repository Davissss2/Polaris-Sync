[package]
name = "polaris"
authors = ["Polaris contributors"]
description = "Roblox sync tool: two-way live sync between your filesystem and Roblox Studio"
repository = "https://github.com/Davissss2/Polaris-Sync"
license = "Apache-2.0"
# Keep major.minor in sync with `plugin/wally.toml`, the plugin refuses
# to talk to a CLI with a different protocol generation
version = "0.1.2"
edition = "2021"

[[bin]]
name = "polaris"
path = "src/main.rs"

[lib]
name = "polaris"
path = "src/lib.rs"

[dependencies]
rbx_xml = "2.0.1"
rbx_binary = "2.0.1"
rbx_dom_weak = "4.1.0"
rbx_reflection = "6.1.0"
rbx_reflection_database = "2.0.2"

config-derive = { version = "*", path = "crates/config-derive" }
json-formatter = { version = "*", path = "crates/json-formatter" }
profiling = { version = "*", path = "crates/profiling/profiling" }

uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
serde = { version = "1.0.228", features = ["derive"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
clap = { version = "4.5.60", features = ["derive", "cargo"] }
reqwest = { version = "0.12.28", default-features = false, features = [
	"blocking",
	"rustls-tls",
	"json",
] }

notify-debouncer-full = "0.3.1"
clap-verbosity-flag = "2.2.3"
crossbeam-channel = "0.5.15"
derive-from-one = "0.1.0"
roblox_install = "1.0.0"
panic-message = "0.3.0"
actix-msgpack = "0.1.4"
puffin_http = "0.16.0"
serde_json = "1.0.149"
env_logger = "0.11.6"
include_dir = "0.7.4"
directories = "5.0.1"
lazy_static = "1.5.0"
backtrace = "0.3.76"
documented = "0.9.2"
dialoguer = "0.12.0"
path-clean = "1.0.1"
rmp-serde = "1.3.1"
actix-web = "4.13.0"
multimap = "0.10.1"
optfield = "0.4.0"
markdown = "0.3.0"

json2lua = "0.1.3"
toml2lua = "0.1.0"
yaml2lua = "0.1.1"
globenv = "0.2.1"

puffin = "0.19.0"
colored = "2.2.0"
anyhow = "1.0.102"
chrono = "0.4.44"
notify = "6.1.1"
whoami = "1.6.1"
trash = "5.2.5"
ctrlc = "3.5.2"
toml = "0.9.12"
glob = "0.3.3"
open = "5.3.3"
log = "0.4.29"
csv = "1.4.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
keybd_event = "0.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.26", features = ["user"] }

[dev-dependencies]
approx = "0.5.1"

# The CLI spends its life inside the sync and build loops: link-time
# optimisation plus a single codegen unit is a straight win over the
# default release profile, and stripping keeps the download small.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
notify-debouncer-full = { path = "crates/notify-debouncer-full" }
