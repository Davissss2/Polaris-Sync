name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64

          - host: linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64

          - host: macos
            os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64

          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

          - host: windows
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cd dist

          if [ "${{ matrix.host }}" = "windows" ]; then
            cp "../target/${{ matrix.target }}/release/polaris.exe" .
            7z a "../polaris-${{ github.ref_name }}-${{ matrix.label }}.zip" polaris.exe
          else
            cp "../target/${{ matrix.target }}/release/polaris" .
            zip -j "../polaris-${{ github.ref_name }}-${{ matrix.label }}.zip" polaris
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-${{ matrix.label }}
          path: polaris-${{ github.ref_name }}-${{ matrix.label }}.zip
          if-no-files-found: error

  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    # A broken plugin build must not block the CLI release
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The plugin embeds `src/Lib/Dom/database.msgpack`, which Rojo silently
      # skips: `polaris build` turns it into a ModuleScript, so the CLI builds
      # the plugin. Building it with Rojo ships a plugin that fails on load.
      - name: Build CLI
        run: cargo build --release

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install packages
        working-directory: plugin
        run: aftman install --no-trust-check && wally install

      - name: Build plugin
        run: ./target/release/polaris build plugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: polaris-plugin
          path: Polaris.rbxm
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, plugin]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.rbxm
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
